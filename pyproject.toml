# Конфигурация инструментов разработчика — и ничего больше.
#
# Здесь намеренно НЕТ секции [project] и списка зависимостей: приложение целиком
# написано на стандартной библиотеке Python 3.10+ и не устанавливается как пакет.
# Запуск — PYTHONPATH=src python3 -m app.server, без venv и без pip.
#
# Почему так: на сервере 2 vCPU / 4 GB рядом живут ещё несколько таких проектов.
# Каждая рантайм-зависимость — это обновления, уязвимости и память, которых при
# нагрузке «десятки заказов в месяц» ничего не оправдывает. Появление строки
# dependencies = [...] в этом файле означает, что архитектурное решение проекта
# изменили — это обсуждается отдельно, а не приезжает вместе с фичей.
#
# pytest, ruff и black ставятся разработчику глобально: pip install pytest ruff black.

[tool.ruff]
line-length = 110
target-version = "py310"
src = ["src", "tests", "scripts"]
exclude = ["var", ".venv", "__pycache__"]

[tool.ruff.lint]
# E,F — базовые ошибки и стиль; I — порядок импортов; N — имена;
# UP — современный синтаксис (проект на 3.10, старые конструкции не нужны);
# B — типовые ловушки bugbear; SIM — упрощения.
select = ["E", "F", "I", "N", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# RU: conftest кладёт src в sys.path до импортов приложения — иначе они не найдутся.
"tests/conftest.py" = ["E402"]

[tool.black]
line-length = 110
target-version = ["py310"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
