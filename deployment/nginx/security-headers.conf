# Заголовки безопасности. Устанавливается как
#   /etc/nginx/snippets/dokumatika-security-headers.conf
#
# ПОЧЕМУ ОТДЕЛЬНЫЙ ФАЙЛ, А НЕ ОДИН add_header В server {}.
# add_header наследуется вниз по уровням конфигурации ТОЛЬКО пока на текущем
# уровне нет ни одного своего add_header. Стоит добавить в location, например,
# Cache-Control — и все заголовки, унаследованные от server, исчезают из ответа
# этого location. Молча. Поэтому набор вынесен в snippet и подключается
# include'ом в КАЖДОМ location, который добавляет что-то своё.
#
# Проверять после правки: curl -sI https://dokumatika.ru/ | sort

# RU: Браузер не пытается угадать тип по содержимому. Без этого .txt с HTML
# внутри может быть исполнен как страница.
add_header X-Content-Type-Options "nosniff" always;

# RU: На внешние сайты уходит только origin, на http — ничего. Полный путь
# заказа (/zakaz/<токен>/) не должен утечь в Referer чужому серверу: этот токен
# и есть доступ к оплаченным документам.
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# RU: Отключаем всё, чего сайту не нужно. Пустой список = запрет для всех.
add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=(), interest-cohort=()" always;

# RU: Дублирует frame-ancestors 'none' из CSP для старых браузеров.
add_header X-Frame-Options "DENY" always;

# HSTS — ВКЛЮЧАТЬ ТОЛЬКО ПОСЛЕ ТОГО, КАК HTTPS ТОЧНО РАБОТАЕТ.
# Заголовок запоминается браузером на год: если после включения сертификат
# сломается или домен временно останется без TLS, посетители получат страницу
# ошибки без кнопки «всё равно перейти», и откатить это с сервера нельзя.
# Порядок: 1) сайт неделю живёт на валидном сертификате, 2) certbot renew
# отработал вхолостую (--dry-run), 3) снимаем комментарий, 4) только потом,
# при желании, добавляем preload и подаём домен в hstspreload.org.
# add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

# ---------------------------------------------------------------------- CSP
# Политика ровно под то, что есть на страницах: свои css/js, картинки свои и
# data:, отправка форм — только к себе и на платёжную страницу Robokassa.
# frame-ancestors 'none' + object-src 'none' + base-uri 'self' закрывают
# кликджекинг, плагины и подмену базового URL.
#
# Известные следствия (осознанные, описаны в ROLLOUT.md):
#  1. Страница /pay/ содержит inline-скрипт автосабмита формы — для неё в
#     dokumatika.conf прописана отдельная, чуть более мягкая CSP.
#  2. Заглушка режима обслуживания рендерится с inline <style>; при включённом
#     maintenance она будет без оформления, но полностью читаемой.
#  3. Счётчик Яндекс.Метрики (METRIKA_ID) этой политикой блокируется —
#     см. закомментированный вариант ниже.
add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; frame-ancestors 'none'; object-src 'none'; img-src 'self' data:; style-src 'self'; script-src 'self'; form-action 'self' https://auth.robokassa.ru" always;

# ВАРИАНТ ДЛЯ САЙТА СО СЧЁТЧИКОМ МЕТРИКИ.
# Метрика вставляется inline-скриптом и подгружает tag.js с mc.yandex.ru,
# а её noscript-пиксель использует inline-стиль. Строгую CSP это не переживёт.
# Включая счётчик, замените строку add_header выше на эту — и понимайте цену:
# 'unsafe-inline' в script-src снимает основную защиту от XSS.
# Альтернатива без ослабления политики — отказаться от Метрики и пользоваться
# встроенной воронкой в /admin/ (она считает события на сервере).
# add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; frame-ancestors 'none'; object-src 'none'; img-src 'self' data: https://mc.yandex.ru; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline' https://mc.yandex.ru; connect-src 'self' https://mc.yandex.ru; frame-src https://mc.yandex.ru; form-action 'self' https://auth.robokassa.ru" always;
