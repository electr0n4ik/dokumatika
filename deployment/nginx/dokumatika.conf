# nginx для dokumatika.ru
#
# Установка: /etc/nginx/sites-available/dokumatika.conf + симлинк в
# sites-enabled (файл подключается внутри http {}, поэтому upstream/limit_req_zone
# и map ниже лежат на верхнем уровне файла — это уже контекст http).
#
# Схема: интернет -> nginx (80/443, TLS, лимиты, статика) -> 127.0.0.1:8081.
# Приложение снаружи недоступно в принципе: оно слушает только loopback.
#
# Проверка после любой правки:
#   nginx -t && systemctl reload nginx
#
# ВАЖНО ПРО СОСЕДЕЙ. На сервере живут 3-5 таких проектов, а имена зон
# (limit_req_zone), upstream'ов и map-переменных глобальны для всего nginx.
# Поэтому всё здесь начинается с dokumatika_ — при клонировании проекта
# переименовать обязательно, иначе nginx -t упадёт на дубликате имени.

# ------------------------------------------------------------------ upstream
upstream dokumatika_app {
    server 127.0.0.1:8081 max_fails=3 fail_timeout=10s;
    # RU: Пул постоянных соединений к приложению. Без него nginx открывает новый
    # TCP-сокет на каждый запрос: лишний syscall, лишний поток в
    # ThreadingHTTPServer и рост TIME_WAIT. Работает только в паре с
    # proxy_http_version 1.1 и пустым заголовком Connection (см. server ниже).
    keepalive 16;
    keepalive_timeout 60s;
    keepalive_requests 1000;
}

# -------------------------------------------------------------------- лимиты
# RU: 10m зоны хватает примерно на 160 тысяч адресов — на порядки больше, чем
# нужно сайту с трафиком в тысячи визитов в сутки.
limit_req_zone $binary_remote_addr zone=dokumatika_all:10m   rate=10r/s;
limit_req_zone $binary_remote_addr zone=dokumatika_order:10m rate=20r/m;
limit_conn_zone $binary_remote_addr zone=dokumatika_conn:10m;

# RU: 429 вместо дефолтного 503: 503 поисковики читают как «сайт лежит», а 429
# — как «слишком часто прошу», и это не влияет на индексацию.
limit_req_status 429;
limit_conn_status 429;

# ------------------------------------------------------------ кэш статики
# RU: Ссылки на css/js идут с ?v=<версия сборки> (см. RuntimeConfig.asset_version).
# Версионированный URL можно кэшировать год и не проверять — при правке файла
# меняется версия, а с ней и URL. Без ?v= (кто-то открыл файл руками) — сутки.
map $arg_v $dokumatika_static_cache {
    ""      "public, max-age=86400";
    default "public, max-age=31536000, immutable";
}

# ============================================================= HTTP -> HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name dokumatika.ru www.dokumatika.ru;

    # RU: ACME-проверка обязана отвечать именно по http:// — до выпуска первого
    # сертификата https ещё нет, а при продлении редирект на него ломает часть
    # клиентов certbot. Этот location стоит ВЫШЕ редиректа не случайно.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        access_log off;
    }

    location / {
        return 301 https://dokumatika.ru$request_uri;
    }
}

# ============================================================ www -> apex
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    # nginx >= 1.25.1: http2 — отдельная директива. Суффикс `listen ... http2`
    # там объявлен устаревшим и печатает warning в nginx -t.
    http2 on;
    # Для nginx < 1.25.1 закомментируйте строку выше и используйте:
    #   listen 443 ssl http2;
    #   listen [::]:443 ssl http2;
    server_name www.dokumatika.ru;

    ssl_certificate     /etc/letsencrypt/live/dokumatika.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dokumatika.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # RU: Канонический хост один — apex. Дубль www ломает склейку сигналов
    # для поисковиков, а на sitemap.xml и canonical в разметке стоит apex.
    return 301 https://dokumatika.ru$request_uri;
}

# ================================================================ основной
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    # Для nginx < 1.25.1 — см. комментарий в предыдущем блоке.
    server_name dokumatika.ru;

    ssl_certificate     /etc/letsencrypt/live/dokumatika.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dokumatika.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    server_tokens off;
    charset utf-8;

    # RU: Приложение отбрасывает тела больше 64 КБ (MAX_BODY_BYTES). Пусть
    # лишнее отсекается здесь, до того как займёт поток Python.
    client_max_body_size 64k;
    client_body_timeout 15s;
    client_header_timeout 15s;
    send_timeout 30s;
    keepalive_timeout 65s;

    # RU: Больше 20 одновременных соединений с одного адреса на статичном сайте
    # без картинок — это не читатель.
    limit_conn dokumatika_conn 20;

    access_log /var/log/nginx/dokumatika-access.log;
    error_log  /var/log/nginx/dokumatika-error.log warn;

    # --------------------------------------------------------------- сжатие
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_proxied any;
    # RU: text/html сжимается всегда и в списке не указывается.
    # RU: text/javascript — тип, который отдают новые сборки nginx для .js;
    # без него wizard.js и docgen.js поехали бы несжатыми.
    gzip_types text/plain text/css application/javascript text/javascript application/json
               application/xml application/rss+xml image/svg+xml;

    # ------------------------------------------------------- параметры прокси
    # RU: Заданы на уровне server и наследуются всеми location — proxy_set_header
    # наследуется, пока location не объявит СВОЙ proxy_set_header. Поэтому ниже
    # в location только proxy_pass, и разъехаться заголовки не могут.
    proxy_http_version 1.1;
    # RU: Пустой Connection обязателен: без него nginx шлёт upstream'у
    # "Connection: close", и пул keepalive выше не работает вообще.
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_send_timeout 30s;
    proxy_read_timeout 30s;
    proxy_buffering on;
    proxy_buffer_size 8k;
    proxy_buffers 16 8k;
    # RU: Страницы ошибок рисует приложение (они на русском и с навигацией) —
    # перехватывать их не нужно.
    proxy_intercept_errors off;

    # ------------------------------------------------------------- здоровье
    location = /healthz {
        # RU: Раз в минуту из мониторинга — в логах это шум, который вытеснит
        # полезные записи задолго до ротации.
        access_log off;
        # RU: Ответ отдаёт uptime и статус приёма платежей. Ничего секретного,
        # но если мониторинг ходит с известного адреса — закройте:
        # allow 127.0.0.1; allow <адрес мониторинга>; deny all;
        proxy_pass http://dokumatika_app;
    }

    # ------------------------------------------------- колбэк Robokassa
    # ГЛАВНОЕ ПРАВИЛО: здесь НЕТ limit_req. Это единственный запрос, который
    # переводит заказ в «оплачен». Потерять его из-за 429 = человек заплатил и
    # не получил документы. Robokassa повторяет уведомление, но полагаться на
    # это, отбивая её же лимитом, — плохая идея.
    location = /robokassa/result {
        # RU: Второй рубеж, не первый. Настоящая проверка — подпись на
        # Пароле #2 внутри приложения; IP лишь отсекает шум и подбор.
        # Если Robokassa сменит адреса, колбэки начнут получать 403: заказы
        # повиснут в pending, и их подберёт scripts/reconcile_payments.py.
        # Как быстро снять ограничение: закомментировать три строки ниже,
        # nginx -t && systemctl reload nginx.
        allow 185.59.216.65;
        allow 185.59.217.65;
        deny all;

        # RU: Отдельный лог платёжных уведомлений — при разборе спора с
        # покупателем он нужен целиком и не должен теряться среди трафика.
        access_log /var/log/nginx/dokumatika-robokassa.log;

        proxy_pass http://dokumatika_app;
    }

    # ------------------------------------------------------- создание заказа
    location = /api/order {
        # RU: 20 заказов в минуту с адреса — заведомо выше живого сценария
        # (человек оформляет один заказ), но не мешает офису за одним NAT.
        # nodelay: первые 5 запросов burst'а проходят сразу, а не размазываются.
        limit_req zone=dokumatika_order burst=5 nodelay;
        include snippets/dokumatika-security-headers.conf;
        proxy_pass http://dokumatika_app;
    }

    # --------------------------------------------------- страница перехода
    # RU: Раньше здесь стоял отдельный блок с CSP-хешем: автосабмит формы был
    # inline-скриптом, и его приходилось разрешать по хешу содержимого, а хеш —
    # пересчитывать при каждой правке. Теперь скрипт живёт в /js/pay.js и
    # проходит обычный script-src 'self', поэтому блок ничем не отличается от
    # остальных и просто наследует общий snippet.
    location ^~ /pay/ {
        include snippets/dokumatika-security-headers.conf;
        limit_req zone=dokumatika_all burst=20 nodelay;
        proxy_pass http://dokumatika_app;
    }

    # ------------------------------------------------------------- админка
    location ^~ /admin {
        # RU: Доступ и так по токену из ADMIN_TOKEN, но админка — единственная
        # страница, где видны заказы и почты покупателей. Если у вас статический
        # адрес, впишите его и раскомментируйте:
        # allow <ваш IP>; deny all;
        limit_req zone=dokumatika_all burst=10 nodelay;
        include snippets/dokumatika-security-headers.conf;
        add_header Cache-Control "no-store" always;
        # RU: Служебную страницу не должно быть видно ни в одном индексе, даже
        # если кто-то дал на неё ссылку.
        add_header X-Robots-Tag "noindex, nofollow" always;
        proxy_pass http://dokumatika_app;
    }

    # -------------------------------------------------------------- статика
    # RU: css/js/картинки отдаёт nginx напрямую с диска — Python на это тратить
    # поток незачем. try_files с откатом в @app страхует от рассинхрона: если
    # файла на диске нет (например, статика лежит в другом каталоге), запрос
    # уйдёт в приложение, которое умеет отдавать её само.
    location ~* \.(?:css|js|mjs|map|svg|ico|png|jpe?g|webp|avif|gif|woff2)$ {
        root /opt/dokumatika/src/static;
        try_files $uri @app;

        include snippets/dokumatika-security-headers.conf;
        add_header Cache-Control $dokumatika_static_cache always;

        access_log off;
        expires off;   # RU: срок жизни задаём одним Cache-Control выше
        tcp_nodelay off;
    }

    location @app {
        include snippets/dokumatika-security-headers.conf;
        proxy_pass http://dokumatika_app;
    }

    # ---------------------------------------------------------------- всё
    location / {
        limit_req zone=dokumatika_all burst=20 nodelay;
        include snippets/dokumatika-security-headers.conf;
        proxy_pass http://dokumatika_app;
    }
}
